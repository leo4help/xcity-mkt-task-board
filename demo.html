<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing 任務看板（Demo）</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .demo-banner {
      background: var(--brand-deep); color: #fff; text-align: center;
      font-size: 12.5px; font-weight: 600; padding: 8px 16px;
    }
    .demo-banner a { color: #e8cf8a; }
  </style>
</head>
<body>
  <div class="demo-banner">🎬 這是 Demo 模式，資料是假的，新增/編輯/刪除只會存在你目前這個瀏覽器分頁裡，重新整理就會重置 · <a href="demo-dashboard.html">看老闆儀表板 Demo →</a></div>

  <div id="lock-screen" class="lock-screen" style="display:none;">
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <h2>Marketing 任務看板</h2>
      <p class="lock-hint">請輸入存取密碼</p>
      <input type="password" id="lock-input" placeholder="密碼" autocomplete="off">
      <button id="lock-submit">進入</button>
      <p class="lock-error" id="lock-error"></p>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header class="top">
      <div class="header-inner">
        <div class="logo-row">
          <div class="logo-block">XCITY</div>
          <div class="logo-sub">Marketing</div>
        </div>
        <div class="meta-chip" id="last-updated">載入中...</div>
      </div>
      <div class="header-inner" style="margin-top:6px;">
        <div class="title-block">
          <h1>任務看板</h1>
          <div class="sub">依專案分組・新增/更新任務、標記卡關與 Support Need</div>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="btn-icon" title="重新整理">⟳</button>
          <button id="add-task-btn" class="btn-primary">+ 新增任務</button>
        </div>
      </div>
    </header>

    <nav class="secnav">
      <div class="inner" id="project-nav">
        <a href="#overview">總覽</a>
      </div>
    </nav>

    <div class="wrap">
      <section id="overview">
        <div class="sec-head"><h2>總覽</h2><span class="sec-tag" id="overview-tag">全部專案</span></div>

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">進行中</div>
            <div class="kpi-value" id="kpi-doing">-</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">本日到期</div>
            <div class="kpi-value" id="kpi-today">-</div>
          </div>
          <div class="kpi-card alert">
            <div class="kpi-label">卡關中</div>
            <div class="kpi-value" id="kpi-blocked">-</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">達成率</div>
            <div class="kpi-value" id="kpi-completion">-</div>
          </div>
        </div>

        <div class="filters" style="margin-top:20px;">
          <select id="filter-priority">
            <option value="">所有優先度</option>
            <option value="high">高（8-10 分）</option>
            <option value="mid">中（4-7 分）</option>
            <option value="low">低（1-3 分）</option>
          </select>
          <select id="filter-status">
            <option value="">所有狀態</option>
            <option value="To Do">To Do</option>
            <option value="Processing">Processing</option>
            <option value="Waiting">Waiting</option>
            <option value="On Hold">On Hold</option>
            <option value="Done">Done</option>
          </select>
          <select id="filter-blocked">
            <option value="">所有任務</option>
            <option value="yes">只看卡關中</option>
          </select>
          <input type="search" id="filter-search" placeholder="搜尋任務名稱...">
          <button id="filter-reset" class="btn-secondary">清除篩選</button>
        </div>
      </section>

      <main id="project-sections">
        <div class="loading">載入中...</div>
      </main>

      <footer class="page-footer">
        <p>Demo 模式（假資料）· <a href="demo-dashboard.html">老闆儀表板 Demo →</a></p>
      </footer>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="demo-config.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
