<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing 任務儀表板（Demo）</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .demo-banner {
      background: var(--brand-deep); color: #fff; text-align: center;
      font-size: 12.5px; font-weight: 600; padding: 8px 16px;
    }
    .demo-banner a { color: #e8cf8a; }
  </style>
</head>
<body>
  <div class="demo-banner">🎬 這是 Demo 模式，資料是假的 · <a href="demo.html">看團隊看板 Demo →</a></div>

  <div id="lock-screen" class="lock-screen" style="display:none;">
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <h2>Marketing 任務儀表板</h2>
      <p class="lock-hint">請輸入存取密碼</p>
      <input type="password" id="lock-input" placeholder="密碼" autocomplete="off">
      <button id="lock-submit">進入</button>
      <p class="lock-error" id="lock-error"></p>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header class="top">
      <div class="header-inner">
        <div class="logo-row">
          <div class="logo-block">XCITY</div>
          <div class="logo-sub">Marketing</div>
        </div>
        <div class="meta-chip" id="last-updated">載入中...</div>
      </div>
      <div class="header-inner" style="margin-top:6px;">
        <div class="title-block">
          <h1>任務儀表板</h1>
          <div class="sub">依專案呈現進度・每 5 分鐘自動更新</div>
        </div>
        <div class="header-actions">
          <a href="demo.html" class="btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;">打開任務看板</a>
          <button id="refresh-btn" class="btn-icon" title="重新整理">⟳</button>
        </div>
      </div>
    </header>

    <nav class="secnav">
      <div class="inner" id="project-nav">
        <a href="#overview">總覽</a>
      </div>
    </nav>

    <div class="wrap">
      <section id="overview">
        <div class="sec-head"><h2>本週總覽</h2><span class="sec-tag" id="overview-tag">全部專案</span></div>

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">總任務數</div>
            <div class="kpi-value" id="kpi-total">-</div>
            <div class="kpi-sub" id="kpi-total-sub">-</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">進行中</div>
            <div class="kpi-value" id="kpi-doing">-</div>
            <div class="kpi-sub" id="kpi-doing-sub">-</div>
          </div>
          <div class="kpi-card hero">
            <div class="kpi-label">已完成 / 持續執行 / 達成率</div>
            <div class="kpi-value" id="kpi-done">-</div>
            <div class="kpi-sub" id="kpi-rate-sub">-</div>
          </div>
          <div class="kpi-card alert">
            <div class="kpi-label">需要支援</div>
            <div class="kpi-value" id="kpi-blocked">-</div>
            <div class="kpi-sub" id="kpi-overdue-sub">-</div>
          </div>
        </div>

        <div class="callout" id="overview-callout"></div>
      </section>

      <section id="partners" class="tab-hidden">
        <div class="sec-head"><h2>夥伴支援任務</h2><span class="sec-tag">追蹤跨部門/夥伴支援進度（唯讀）</span></div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>夥伴名</th><th>關聯專案</th><th>關聯任務</th><th>支援項目/細節</th><th>狀態</th><th>期限</th><th>備注</th>
              </tr>
            </thead>
            <tbody id="partners-body"></tbody>
          </table>
        </div>
      </section>

      <main id="project-sections">
        <div class="loading">載入中...</div>
      </main>

      <footer class="page-footer">
        <p>Demo 模式（假資料）· <a href="demo.html">打開任務看板 Demo →</a></p>
      </footer>
    </div>
  </div>

  <script src="demo-config.js"></script>
  <script src="demo-data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
